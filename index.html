<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Champion</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comic+Neue:wght@300;400;700&family=Oswald:wght@200;700&display=swap');
    </style>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Hero Section -->
    <section class="hero-image"></section>

    <!-- Intro Section -->
    <section class="one-column">
        <div class="image">
            <img class="pokemon-image" src="./images/logo.png" alt="Pokemon logo">
        </div>

        <div class="info">
            <p>
                Pokémon Champions is a battle-focused, cross-platform Pokémon game designed for competitive and casual play, available on Nintendo Switch and mobile devices.
            </p>
        </div>
    </section>

    <!-- Topic Section -->
    <a href="cool-things.html" class="topic-section-title">
        <h2 class="topic-section-letter">Cool things in Pokemon Champion:</h2>
        <p class="topic-section-click">Click the images below for more info</p>
    </a>


    <!-- Cards Section -->
    <section class="three-column">
        <div class="card">
            <img class="card-image" src="./images/home.png" alt="Pokemon Home">
            <h2 class="card-text">Pokemon Home</h2>
        </div>

        <div class="card">
            <img class="card-image" src="./images/mega.png" alt="Mega Pokemon">
            <h2 class="card-text">Inside the game</h2>
        </div>

        <div class="card">
            <img class="card-image" src="./images/inci.png" alt="Competitive">
            <h2 class="card-text">Competitive</h2>
        </div>
    </section>

    <!-- Footer Title -->
    <section>
        <h2 class="topic-section-title">Pokemon Champion Website</h2>
    </section>

</body>
</html>
